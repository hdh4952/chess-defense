name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩 순서대로. 진행 중인 배포를 취소하면 사이트가 중간 상태로 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 20은 2026-04-30에 LTS 유지보수가 끝났다. 또 rollup의 optional 의존성
          # @napi-rs/lzma-linux-x64-gnu가 node ^22.20 이상을 요구해, ubuntu-x64 러너에서는
          # node 20이면 엔진 불일치로 조용히 건너뛰어진다(optional이라 설치는 실패하지 않지만
          # 매번 EBADENGINE 경고가 남는다). 22 LTS로 올려 둘 다 해소한다.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 이 단계는 저장소 Settings > Pages 의 Source가 "GitHub Actions"로 지정되어 있어야 통과한다.
      # (enablement 옵션으로 워크플로가 직접 켜는 방법은 GITHUB_TOKEN 권한으로는 거부된다.)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
